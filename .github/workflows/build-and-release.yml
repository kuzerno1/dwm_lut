name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'           # Stable releases (v4.1.0)
      - 'v*.*.*-rc*'       # Release candidates (v4.1.0-rc1)
      - 'v*.*.*-beta*'     # Beta releases (v4.1.0-beta1)
      - 'v*.*.*-alpha*'    # Alpha releases (v4.1.0-alpha1)
      - 'v*.*.*-dev*'      # Development releases (v4.1.0-dev1)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          ./vcpkg_installed/
          ./vcpkg/
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('lutdwm/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        ./bootstrap-vcpkg.bat
        cd ..

    - name: Configure vcpkg
      run: |
        cd vcpkg
        ./vcpkg integrate install
        cd ..

    - name: Restore NuGet packages
      run: |
        nuget restore lutdwm.sln
        nuget restore DwmLutGUI/DwmLutGUI.sln

    - name: Build Solutions
      run: |
        msbuild lutdwm.sln /p:Configuration=Release /p:Platform=x64
        msbuild DwmLutGUI/DwmLutGUI.sln /p:Configuration=Release /p:Platform=x64

    - name: Determine Release Type
      id: release_type
      run: |
        $tag = "${{ github.ref_name }}"
        $isPrerelease = $false
        $releaseSuffix = ""
        $releaseType = ""

        if ($tag -match 'v.*-(alpha|beta|rc|dev).*') {
          $isPrerelease = $true
          $releaseSuffix = "-$($matches[1])"
          switch ($matches[1]) {
            'alpha' { $releaseType = " (Alpha)" }
            'beta' { $releaseType = " (Beta)" }
            'rc' { $releaseType = " (Release Candidate)" }
            'dev' { $releaseType = " (Development)" }
          }
        }

        echo "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
        echo "release_name=DwmLut $tag$releaseType" >> $env:GITHUB_OUTPUT
        echo "package_name=DwmLut$releaseSuffix-$tag" >> $env:GITHUB_OUTPUT

    - name: Create Release Package
      run: |
        mkdir ReleasePackage
        copy "DwmLutGUI\DwmLutGUI\bin\x64\Release\*" ReleasePackage\
        copy "x64\Release\dwm_lut.dll" ReleasePackage\

    - name: Verify Build Artifacts
      run: |
        if (-not (Test-Path "DwmLutGUI\DwmLutGUI\bin\x64\Release\DwmLutGUI.exe")) {
          Write-Error "DwmLutGUI.exe not found in build output"
          exit 1
        }
        if (-not (Test-Path "x64\Release\dwm_lut.dll")) {
          Write-Error "dwm_lut.dll not found in build output"
          exit 1
        }

    - name: Create Zip Archive
      run: |
        Compress-Archive -Path ReleasePackage/* -DestinationPath "${{ steps.release_type.outputs.package_name }}.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.release_type.outputs.package_name }}
        path: ${{ steps.release_type.outputs.package_name }}.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.release_type.outputs.package_name }}.zip
        name: ${{ steps.release_type.outputs.release_name }}
        draft: false
        prerelease: ${{ steps.release_type.outputs.is_prerelease }}
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}