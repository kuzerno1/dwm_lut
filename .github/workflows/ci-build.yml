name: CI Build

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          ./vcpkg_installed/
          ./vcpkg/
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('lutdwm/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        ./bootstrap-vcpkg.bat
        cd ..

    - name: Configure vcpkg
      run: |
        cd vcpkg
        ./vcpkg integrate install
        cd ..

    - name: Restore NuGet packages
      run: |
        nuget restore lutdwm.sln
        nuget restore DwmLutGUI/DwmLutGUI.sln

    - name: Build Solutions
      run: |
        msbuild lutdwm.sln /p:Configuration=Release /p:Platform=x64
        msbuild DwmLutGUI/DwmLutGUI.sln /p:Configuration=Release /p:Platform=x64

    - name: Verify Build Output
      run: |
        if (-not (Test-Path "DwmLutGUI\DwmLutGUI\bin\x64\Release\DwmLutGUI.exe")) {
          Write-Error "DwmLutGUI.exe not found in build output"
          exit 1
        }
        if (-not (Test-Path "lutdwm\x64\Release\lutdwm.dll")) {
          Write-Error "lutdwm.dll not found in build output"
          exit 1
        }
        Write-Host "Build verification successful - All required files found"